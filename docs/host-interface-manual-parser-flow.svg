<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">LIT Host Interface Manual parser flow</title>
  <desc id="desc">A visual overview showing how the LIT software reads the Host Interface Manual PDF, extracts assay definitions, maps them to application settings, and uses them in dropdowns and HL7 message generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="55%" stop-color="#f9fbf7"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b6fcc"/>
      <stop offset="100%" stop-color="#27a9e1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f8f63"/>
      <stop offset="100%" stop-color="#7bbf45"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0%" stop-color="#c56c14"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#19324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0b6fcc"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f8f63"/>
    </marker>
    <style>
      .title { font: 700 34px Segoe UI, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 16px Segoe UI, Arial, sans-serif; fill: #516579; }
      .stage-title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #17324d; }
      .box-title { font: 700 16px Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 400 13px Segoe UI, Arial, sans-serif; fill: #263847; }
      .box-text-strong { font: 700 13px Segoe UI, Arial, sans-serif; fill: #263847; }
      .small { font: 400 12px Segoe UI, Arial, sans-serif; fill: #516579; }
      .code { font: 600 12px Consolas, Menlo, monospace; fill: #203040; }
      .pill { font: 700 12px Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d5e1ea; stroke-width: 1.2; filter: url(#shadow); }
      .section { fill: rgba(255,255,255,0.74); stroke: #d8e3ec; stroke-width: 1.2; }
      .line-blue { stroke: #0b6fcc; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #2f8f63; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .thin-line { stroke: #9fb0bf; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1320" height="860" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Host Interface Manual Parser</text>
  <text x="60" y="86" class="subtitle">How LIT turns the PDF manual into assay choices, sample constraints, result options, and control-result examples.</text>

  <rect x="40" y="120" width="1240" height="120" rx="10" class="section"/>
  <text x="62" y="151" class="stage-title">1. Input and page extraction</text>

  <g transform="translate(70 170)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="url(#blue)"/>
    <text x="18" y="29" class="box-title">HIM PDF</text>
    <path d="M122 8 h22 l10 10 v20 h-32 z" fill="#ffffff" opacity="0.9"/>
    <path d="M144 8 v10 h10" fill="none" stroke="#0b6fcc" stroke-width="2"/>
  </g>

  <path d="M245 193 H365" class="line-blue"/>

  <g transform="translate(390 150)">
    <rect x="0" y="0" width="240" height="78" rx="8" class="card"/>
    <rect x="0" y="0" width="240" height="30" rx="8" fill="#17324d"/>
    <text x="16" y="21" class="box-title">HimPdfReader.ReadPages</text>
    <text x="16" y="53" class="box-text">PdfPig reads words page by page</text>
    <text x="16" y="69" class="small">Keeps table cell boundaries usable</text>
  </g>

  <path d="M650 193 H770" class="line-blue"/>

  <g transform="translate(795 150)">
    <rect x="0" y="0" width="230" height="78" rx="8" class="card"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#0b6fcc"/>
    <text x="16" y="21" class="box-title">Per-page text list</text>
    <text x="16" y="53" class="box-text">One text string per PDF page</text>
    <text x="16" y="69" class="small">Passed into HimParser.Parse</text>
  </g>

  <path d="M1048 193 H1165" class="line-blue"/>

  <g transform="translate(1180 170)">
    <rect x="0" y="0" width="76" height="46" rx="8" fill="#ffffff" stroke="#0b6fcc" stroke-width="2"/>
    <text x="20" y="29" class="code">Parse()</text>
  </g>

  <rect x="40" y="275" width="1240" height="300" rx="10" class="section"/>
  <text x="62" y="306" class="stage-title">2. Parser core</text>

  <g transform="translate(70 333)">
    <rect x="0" y="0" width="240" height="74" rx="8" class="card"/>
    <rect x="0" y="0" width="240" height="30" rx="8" fill="#34495e"/>
    <text x="16" y="21" class="box-title">DetectVersion</text>
    <text x="16" y="53" class="box-text">Finds manual version text</text>
    <text x="16" y="68" class="code">Version 5.3</text>
  </g>

  <g transform="translate(350 333)">
    <rect x="0" y="0" width="240" height="74" rx="8" class="card"/>
    <rect x="0" y="0" width="240" height="30" rx="8" fill="#6f4da8"/>
    <text x="16" y="21" class="box-title">ParseMessageTypes</text>
    <text x="16" y="53" class="box-text">Extracts example HL7 messages</text>
    <text x="16" y="68" class="code">QBP^Q11, OML^O33...</text>
  </g>

  <g transform="translate(630 318)">
    <rect x="0" y="0" width="300" height="150" rx="8" class="card"/>
    <rect x="0" y="0" width="300" height="30" rx="8" fill="url(#green)"/>
    <text x="16" y="21" class="box-title">ParseAssays</text>
    <text x="16" y="55" class="box-text-strong">Anchors on:</text>
    <text x="16" y="76" class="code">&lt;assay&gt; - LIS mapping</text>
    <text x="16" y="99" class="box-text-strong">Extracts:</text>
    <text x="16" y="120" class="box-text">Sample types, tests, targets, result codes</text>
    <text x="16" y="140" class="small">Uses HL7-shaped values instead of rebuilding PDF tables</text>
  </g>

  <g transform="translate(970 318)">
    <rect x="0" y="0" width="270" height="150" rx="8" class="card"/>
    <rect x="0" y="0" width="270" height="30" rx="8" fill="url(#amber)"/>
    <text x="16" y="21" class="box-title">ApplyControlResults</text>
    <text x="16" y="55" class="box-text-strong">Finds control tables:</text>
    <text x="16" y="76" class="code">&lt;assay&gt; control results</text>
    <text x="16" y="99" class="box-text-strong">Extracts names:</text>
    <text x="16" y="120" class="code">(-) C, HxV H (+) C</text>
    <text x="16" y="140" class="small">Cleans PDF artifacts and adds fallbacks</text>
  </g>

  <path d="M1180 216 C1180 260 190 260 190 320" class="thin-line"/>
  <path d="M1180 216 C1180 270 470 270 470 320" class="thin-line"/>
  <path d="M1180 216 C1180 280 780 280 780 305" class="thin-line"/>
  <path d="M1180 216 C1180 280 1105 280 1105 305" class="thin-line"/>

  <rect x="70" y="493" width="1170" height="48" rx="8" fill="#ffffff" stroke="#cbd8e2" stroke-width="1.2"/>
  <text x="92" y="523" class="box-text-strong">Output of parser:</text>
  <text x="230" y="523" class="code">HostInterfaceManual { ManualVersion, MessageTypes, Assays, SampleTypes, Tests, Targets, ControlResults }</text>

  <rect x="40" y="610" width="1240" height="180" rx="10" class="section"/>
  <text x="62" y="641" class="stage-title">3. Mapping into the LIT application</text>

  <g transform="translate(75 675)">
    <rect x="0" y="0" width="230" height="70" rx="8" class="card"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#17324d"/>
    <text x="16" y="21" class="box-title">HimCatalogMapper</text>
    <text x="16" y="53" class="box-text">Projects manual models to UI models</text>
  </g>

  <path d="M325 710 H425" class="line-green"/>

  <g transform="translate(450 658)">
    <rect x="0" y="0" width="290" height="104" rx="8" class="card"/>
    <rect x="0" y="0" width="290" height="30" rx="8" fill="#2f8f63"/>
    <text x="16" y="21" class="box-title">LitSettings catalog</text>
    <text x="16" y="52" class="box-text">TestTypes with targets and controls</text>
    <text x="16" y="72" class="box-text">SampleTypes with allowed volumes</text>
    <text x="16" y="92" class="box-text">SampleVolumes sorted for dropdowns</text>
  </g>

  <path d="M760 710 H860" class="line-green"/>

  <g transform="translate(885 650)">
    <rect x="0" y="0" width="335" height="120" rx="8" class="card"/>
    <rect x="0" y="0" width="335" height="30" rx="8" fill="#0b6fcc"/>
    <text x="16" y="21" class="box-title">Used by LIT</text>
    <text x="16" y="54" class="box-text">Dropdown dependencies: Test -> Sample Type -> Volume</text>
    <text x="16" y="76" class="box-text">Result choices per assay target</text>
    <text x="16" y="98" class="box-text">Control-result examples and Send to LIS</text>
  </g>

  <g transform="translate(74 804)">
    <rect x="0" y="0" width="1170" height="34" rx="7" fill="#17324d" opacity="0.94"/>
    <text x="18" y="23" class="pill">Design note:</text>
    <text x="106" y="23" class="pill">The parser relies on stable manual landmarks and HL7 value patterns because raw PDF tables can reorder or glue cells together.</text>
  </g>
</svg>
